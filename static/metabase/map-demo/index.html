<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FalaBoss map demo · city heat (example)</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    html, body { margin:0; height:100%; font-family: system-ui, sans-serif; }
    #map { height:100%; width:100%; background:#e8eef3; }
    .banner {
      position:absolute; z-index:1000; left:12px; top:12px; right:12px;
      max-width:520px; background:rgba(255,255,255,.92); border:1px solid #d0d7de;
      border-radius:10px; padding:10px 12px; font-size:13px; line-height:1.45; color:#24292f;
      box-shadow:0 2px 8px rgba(0,0,0,.08);
    }
    .banner strong { color:#0969da; }
    .banner .warn { color:#9a6700; }
  </style>
</head>
<body>
  <div class="banner">
    <div><strong>Demo only</strong> · 巴西 50 城 · 淡底图 + 热力（非 pin 重点）</div>
    <div class="warn">指标 = <code>population_2024</code>（维表示例），不是 Job Category / Ads 业务数。</div>
    <div>给 Metabase iframe 用：整页 HTTPS 嵌即可。底图 Esri Light Gray，无 API key。</div>
  </div>
  <div id="map"></div>
  <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/leaflet.heat@0.2.0/dist/leaflet-heat.js"></script>
  <script>

ue": 518263}, {"city_name": "Niterói", "uf": "RJ", "lat": -22.8832, "lng": -43.1034, "value": 516720}, {"city_name": "Porto Velho", "uf": "RO", "lat": -8.76077, "lng": -63.8999, "value": 514873}, {"city_name": "Macapá", "uf": "AP", "lat": 0.034934, "lng": -51.0694, "value": 487200}, {"city_name": "Boa Vista", "uf": "RR", "lat": 2.82384, "lng": -60.6753, "value": 470169}, {"city_name": "Rio Branco", "uf": "AC", "lat": -9.97499, "lng": -67.8243, "value": 387852}, {"city_name": "Vitória", "uf": "ES", "lat": -20.3155, "lng": -40.3128, "value": 342800}, {"city_name": "Palmas", "uf": "TO", "lat": -10.24, "lng": -48.3558, "value": 323625}];
    const map = L.map('map', { zoomControl: true, attributionControl: true })
      .setView([-14.2, -51.9], 4);
    // light / faded basemap
    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}', {
      attribution: 'Tiles &copy; Esri',
      maxZoom: 16
    }).addTo(map);

    const maxV = Math.max(...CITIES.map(c => c.value));
    const heat = CITIES.map(c => [c.lat, c.lng, Math.pow(c.value / maxV, 0.55)]);
    L.heatLayer(heat, {
      radius: 28,
      blur: 22,
      maxZoom: 8,
      minOpacity: 0.25,
      gradient: { 0.2: '#c6dbef', 0.45: '#6baed6', 0.7: '#2171b5', 1.0: '#08306b' }
    }).addTo(map);

    // faint city labels on hover only via invisible circles
    const layer = L.layerGroup().addTo(map);
    CITIES.forEach(c => {
      const r = 4 + 14 * Math.sqrt(c.value / maxV);
      const m = L.circleMarker([c.lat, c.lng], {
        radius: r,
        color: 'transparent',
        fillColor: '#2171b5',
        fillOpacity: 0.15,
        weight: 0
      }).bindTooltip(`${c.city_name} (${c.uf})<br/>pop ${c.value.toLocaleString('en-US')}`, { sticky: true });
      layer.addLayer(m);
    });
  </script>
</body>
</html>
