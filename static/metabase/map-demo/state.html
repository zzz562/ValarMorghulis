<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>FalaBoss · Job by state</title>
  <meta name="description" content="Job by state choropleth" />
</head>
<body>
  <noscript>Job by state choropleth requires JavaScript.</noscript>
  <p id="status">Loading Job by state choropleth…</p>
  <script>
  (async () => {
    const status = document.getElementById('status');
    try {
      const base = 'https://raw.githubusercontent.com/zzz562/ValarMorghulis/main/static/metabase/map-demo/_b64/';
      let b64 = '';
      for (let i = 0; i <= 22; i++) {
        const n = String(i).padStart(2, '0');
        const res = await fetch(base + 'b64_' + n + '.txt');
        if (!res.ok) throw new Error('chunk ' + n + ' HTTP ' + res.status);
        b64 += await res.text();
      }
      const bin = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
      const html = new TextDecoder('utf-8').decode(bin);
      document.open();
      document.write(html);
      document.close();
    } catch (e) {
      status.textContent = 'Failed to load choropleth: ' + e;
    }
  })();
  </script>
</body>
</html>
